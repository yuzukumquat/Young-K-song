<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Young K 솔로곡 라이브 체크리스트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  text-align: center;
  background-color: #f4f6f8;
  margin: 0;
  padding: 16px;
  color: #111;
}
h2 { font-size: 20px; margin: 10px 0 5px; }
.sub-title { font-size: 13px; color: #666; margin-bottom: 15px; }

.main-card {
  max-width: 480px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.progress-box {
  position: sticky;
  top: 10px;
  z-index: 10;
  background: #ffffff;
  border: 2px solid #FFCC00;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
.progress-text {
  font-size: 15px;
  font-weight: bold;
  color: #111;
}
.progress-bar-bg {
  background-color: #eee;
  border-radius: 8px;
  height: 10px;
  width: 100%;
  margin-top: 8px;
  overflow: hidden;
}
.progress-bar-fill {
  background-color: #FFCC00;
  height: 100%;
  width: 0%;
  transition: width 0.3s ease;
}

.sub-btn {
  background-color: #eef1f5;
  border: 1px solid #c0c5cd;
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  font-weight: 600;
  color: #222;
  cursor: pointer;
}

.song-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  max-height: 400px;
  overflow-y: auto;
  padding-right: 4px;
}
.song-item {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  transition: background-color 0.15s;
}
.song-item:active {
  background-color: #fff9e6;
}
.song-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #FFCC00;
  margin-right: 12px;
  cursor: pointer;
}
.song-title {
  font-size: 15px;
  font-weight: 500;
  flex: 1;
}

#resultArea {
  display: none;
}

.result-card {
  background: #ffffff;
  border: 2px solid #FFCC00;
  border-radius: 12px;
  padding: 20px 14px;
  text-align: center;
}
.result-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 5px;
}
.result-score {
  font-size: 20px;
  font-weight: bold;
  color: #111;
  margin-bottom: 15px;
}

.album-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: left;
}
.album-group {
  background: #fafafa;
  border-radius: 8px;
  padding: 10px 12px;
  border: 1px solid #eee;
}
.album-header {
  font-size: 13px;
  font-weight: bold;
  color: #000;
  border-bottom: 2px solid #FFCC00;
  padding-bottom: 4px;
  margin-bottom: 8px;
}
.album-song-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 8px;
  font-size: 11px;
}
.song-check-item {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #aaa;
}
.song-check-item.checked {
  color: #111;
  font-weight: bold;
}

.action-btn-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 15px;
}
</style>
</head>
<body>

<div class="main-card">
  <!-- 체크 화면 -->
  <div id="checkArea">
    <h2>Young K 솔로곡 라이브 체크리스트</h2>
    <div class="sub-title">Eternal / Letters with notes / YOUNGEST</div>

    <div class="progress-box">
      <div class="progress-text" id="progressText">0 / 33곡 감상 완료 (0%)</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <div class="song-list" id="songList"></div>

    <button class="sub-btn" onclick="showResult()" style="width:100%; margin-top:15px; padding:14px; background-color:#FFCC00; border-color:#FFCC00; font-size:15px; font-weight:bold;">결과 확인하기</button>
  </div>

  <!-- 결과 화면 -->
  <div id="resultArea">
    <div id="captureTarget" class="result-card">
      <div class="result-title">Young K 솔로곡 라이브 체크리스트</div>
      <div class="result-score" id="resultScoreText">0 / 33곡 (0%)</div>

      <div class="album-grid" id="albumResultGrid"></div>
    </div>

    <div class="action-btn-group">
      <button class="sub-btn" onclick="downloadResultImage()" style="background-color:#e8f5e9; border-color:#c8e6c9; padding:12px;">결과 이미지 저장</button>
      <button class="sub-btn" onclick="backToCheck()" style="padding:12px; margin-top:5px;">다시 체크하기</button>
    </div>
  </div>
</div>

<script>
var albums = [
  {
    name: "Eternal",
    songs: [
      "베스트 송", "끝까지 안아 줄게", "사랑은 얼어 죽을", "Microphone", 
      "want to love you", "그대로 와줘요", "잘 자라 내 사람아"
    ]
  },
  {
    name: "Letters with notes",
    songs: [
      "오늘만을 너만을 이날을", "이것밖에는 없다", "꿈꾼", "natural", "STRANGE",
      "Bungee Jumping", "SOUL", "babo", "what is..", "let it be summer", "playground"
    ]
  },
  {
    name: "YOUNGEST",
    songs: [
      "Marionette", "Shut The Door", "F world", "Hey Honey", "응원가",
      "SPIKE", "Yonge St.", "million reasons", "우리가 헤어질 100가지 이유", 
      "Drivin' into Hell", "whatever", "작업실에서 커피를", "안개꽃", "Goodbye, Love", "집으로 향한다"
    ]
  }
];

var allSongs = [];
albums.forEach(function(album) {
  allSongs = allSongs.concat(album.songs);
});

function initList() {
  var listContainer = document.getElementById("songList");
  listContainer.innerHTML = "";

  var songIndex = 1;
  albums.forEach(function(album) {
    album.songs.forEach(function(songName) {
      var item = document.createElement("label");
      item.className = "song-item";
      
      item.innerHTML = 
        '<input type="checkbox" data-song="' + songName + '" onchange="updateProgress()">' +
        '<span class="song-title">' + songIndex + '. ' + songName + '</span>';
      
      listContainer.appendChild(item);
      songIndex++;
    });
  });

  updateProgress();
}

function updateProgress() {
  var checkboxes = document.querySelectorAll('#songList input[type="checkbox"]');
  var checkedCount = 0;

  checkboxes.forEach(function(cb) {
    if (cb.checked) checkedCount++;
  });

  var total = allSongs.length;
  var percent = Math.round((checkedCount / total) * 100);

  document.getElementById("progressText").innerText = checkedCount + " / " + total + "곡 감상 완료 (" + percent + "%)";
  document.getElementById("progressBarFill").style.width = percent + "%";
}

function showResult() {
  var checkedMap = {};
  var checkedCount = 0;

  var checkboxes = document.querySelectorAll('#songList input[type="checkbox"]');
  checkboxes.forEach(function(cb) {
    var songName = cb.getAttribute('data-song');
    if (cb.checked) {
      checkedMap[songName] = true;
      checkedCount++;
    } else {
      checkedMap[songName] = false;
    }
  });

  var total = allSongs.length;
  var percent = Math.round((checkedCount / total) * 100);

  document.getElementById("resultScoreText").innerText = checkedCount + " / " + total + "곡 (" + percent + "%)";

  var gridContainer = document.getElementById("albumResultGrid");
  gridContainer.innerHTML = "";

  albums.forEach(function(album) {
    var groupDiv = document.createElement("div");
    groupDiv.className = "album-group";

    var headerDiv = document.createElement("div");
    headerDiv.className = "album-header";
    headerDiv.innerText = album.name;
    groupDiv.appendChild(headerDiv);

    var songListDiv = document.createElement("div");
    songListDiv.className = "album-song-list";

    album.songs.forEach(function(songName) {
      var songDiv = document.createElement("div");
      var isChecked = checkedMap[songName];

      if (isChecked) {
        songDiv.className = "song-check-item checked";
        songDiv.innerText = "[✓] " + songName;
      } else {
        songDiv.className = "song-check-item";
        songDiv.innerText = "[  ] " + songName;
      }
      songListDiv.appendChild(songDiv);
    });

    groupDiv.appendChild(songListDiv);
    gridContainer.appendChild(groupDiv);
  });

  document.getElementById("checkArea").style.display = "none";
  document.getElementById("resultArea").style.display = "block";
  window.scrollTo(0, 0);
}

function backToCheck() {
  document.getElementById("resultArea").style.display = "none";
  document.getElementById("checkArea").style.display = "block";
  window.scrollTo(0, 0);
}

function downloadResultImage() {
  var target = document.getElementById("captureTarget");
  html2canvas(target).then(function(canvas) {
    var link = document.createElement("a");
    link.download = "YoungK_Checklist_Result.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

initList();
</script>
</body>
</html>
