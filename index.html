<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Young K 솔로 앨범 전곡 소트</title>
<style>
* { box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
text-align: center;
background-color: #f4f6f8;
margin: 0;
padding: 16px;
color: #111;
}
h2 { font-size: 20px; margin: 10px 0 5px; }
.sub-title { font-size: 13px; color: #666; margin-bottom: 20px; }

#progressBar {
font-size: 14px;
font-weight: bold;
color: #FFCC00;
margin-bottom: 15px;
}

.card-container {
display: flex;
flex-direction: column;
gap: 12px;
max-width: 400px;
margin: 0 auto;
}
.song-btn {
background-color: #ffffff;
border: 2px solid #FFCC00;
border-radius: 12px;
padding: 20px 15px;
font-size: 17px;
font-weight: bold;
color: #000000;
cursor: pointer;
word-break: keep-all;
box-shadow: 0 4px 8px rgba(0,0,0,0.1);
min-height: 80px;
display: flex;
align-items: center;
justify-content: center;
}
.song-btn:active {
background-color: #e6f0ff;
}

.sub-btn-group {
display: flex;
gap: 10px;
margin-top: 5px;
}
.sub-btn {
flex: 1;
background-color: #eef1f5;
border: 1px solid #c0c5cd;
border-radius: 8px;
padding: 12px;
font-size: 14px;
font-weight: 600;
color: #222;
cursor: pointer;
}

#resultContainer { display: none; max-width: 400px; margin: 20px auto; }
.result-table {
width: 100%;
border-collapse: collapse;
background: #ffffff;
border-radius: 8px;
overflow: hidden;
box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.result-table th, .result-table td {
padding: 12px;
border-bottom: 1px solid #eee;
font-size: 14px;
text-align: center;
}
.result-table th { background-color: #0055ff; color: #ffffff; }
</style>
</head>
<body>

<h2>🦊 Young K 솔로 앨범 전곡 소트 🦊</h2>
<div class="sub-title">Eternal & Letters with notes & YOUNGEST</div>

<div id="progressBar">진행률: 0%</div>

<div id="sortContainer" class="card-container">
<button id="leftBtn" class="song-btn" onclick="selectSong(0)">로딩 중...</button>
<button id="rightBtn" class="song-btn" onclick="selectSong(1)">로딩 중...</button>

<div class="sub-btn-group">
<button class="sub-btn" onclick="selectSong(2)">둘 다 좋다</button>
<button class="sub-btn" onclick="selectSong(2)">모르겠다</button>
</div>
</div>

<div id="resultContainer">
<h3>✨ 당신의 Young K 최애곡 순위 ✨</h3>
<table class="result-table">
<thead>
<tr>
<th style="width:25%;">순위</th>
<th>곡 제목</th>
</tr>
</thead>
<tbody id="resultBody"></tbody>
</table>
</div>

<script>
var songs = [
"Marionette",
"Shut The Door",
"F world",
"Hey Honey",
"응원가",
"SPIKE",
"Yonge St.",
"million reasons",
"우리가 헤어질 100가지 이유",
"Drivin' into Hell",
"whatever",
"작업실에서 커피를",
"안개꽃",
"Goodbye, Love",
"집으로 향한다",
"오늘만을 너만을 이날을",
"이것밖에는 없다",
"꿈꾼",
"natural",
"STRANGE",
"Bungee Jumping",
"SOUL",
"babo",
"what is..",
"let it be summer",
"베스트 송",
"끝까지 안아 줄게",
"사랑은 얼어 죽을",
"Microphone",
"want to love you",
"그대로 와줘요",
"잘 자라 내 사람아",
"playground"
 ];

var scores = {};
for (var i = 0; i < songs.length; i++) {
scores[songs[i]] = 0;
}

var pairs = [];
for (var i = 0; i < songs.length; i++) {
for (var j = i + 1; j < songs.length; j++) {
pairs.push([songs[i], songs[j]]);
}
}

// 대진 무작위 섞기
pairs.sort(function() { return 0.5 - Math.random(); });

var currentIdx = 0;
var totalPairs = pairs.length;

function renderPair() {
if (currentIdx >= totalPairs) {
renderResult();
return;
}

var pair = pairs[currentIdx];
document.getElementById("leftBtn").innerText = pair[0];
document.getElementById("rightBtn").innerText = pair[1];

var percent = Math.floor((currentIdx / totalPairs) * 100);
document.getElementById("progressBar").innerText = "진행률: " + percent + "%";
}

function selectSong(choice) {
var pair = pairs[currentIdx];
if (choice === 0) {
scores[pair[0]] += 1;
} else if (choice === 1) {
scores[pair[1]] += 1;
} else {
scores[pair[0]] += 0.5;
scores[pair[1]] += 0.5;
}

currentIdx++;
renderPair();
}

function renderResult() {
document.getElementById("progressBar").innerText = "진행률: 100% (완료!)";
document.getElementById("sortContainer").style.display = "none";
document.getElementById("resultContainer").style.display = "block";

var sortedSongs = songs.slice().sort(function(a, b) {
return scores[b] - scores[a];
});

var tbody = document.getElementById("resultBody");
tbody.innerHTML = "";

for (var i = 0; i < sortedSongs.length; i++) {
var tr = document.createElement("tr");
tr.innerHTML = "<td>" + (i + 1) + "</td><td>" + sortedSongs[i] + "</td>";
tbody.appendChild(tr);
}
}

// 즉시 실행
renderPair();
</script>
</body>
</html>
